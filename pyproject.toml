[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobsheet"
version = "0.1.0"
description = "Collect job ads from anywhere. Get a spreadsheet you actually own."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Antonio Bubnić" }]
keywords = ["jobs", "job-search", "scraper", "excel", "openpyxl", "rss", "ats"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pydantic>=2.7",
    "jinja2>=3.1",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    # Not for building releases -- for `tests/test_packaging.py`, which builds a
    # throwaway wheel and sdist to prove the interface is inside them.
    "hatchling>=1.24",
    "build>=1.2",
]

[project.urls]
Homepage = "https://github.com/antoniobubnic99/jobsheet"
Issues = "https://github.com/antoniobubnic99/jobsheet/issues"

[project.scripts]
jobsheet = "jobsheet.cli:main"

# Built-in sources register through the same entry-point group third-party
# plugins use, so `pip install jobsheet-source-foo` needs no core changes.
[project.entry-points."jobsheet.sources"]
rss = "jobsheet.sources.rss:RssSource"
greenhouse = "jobsheet.sources.ats.greenhouse:GreenhouseSource"
lever = "jobsheet.sources.ats.lever:LeverSource"
ashby = "jobsheet.sources.ats.ashby:AshbySource"
workable = "jobsheet.sources.ats.workable:WorkableSource"
recruitee = "jobsheet.sources.ats.recruitee:RecruiteeSource"
smartrecruiters = "jobsheet.sources.ats.smartrecruiters:SmartRecruitersSource"
remotive = "jobsheet.sources.boards.remotive:RemotiveSource"
remoteok = "jobsheet.sources.boards.remoteok:RemoteOkSource"
arbeitnow = "jobsheet.sources.boards.arbeitnow:ArbeitnowSource"
hzz = "jobsheet.sources.hr.hzz:HzzSource"
posao_hr = "jobsheet.sources.hr.posao_hr:PosaoHrSource"
narodne_novine = "jobsheet.sources.hr.narodne_novine:NarodneNovineSource"
selekcija = "jobsheet.sources.hr.selekcija:SelekcijaSource"

# The interface is a build artifact, so `.gitignore` hides it -- and hatchling
# honours `.gitignore`. Without these two `artifacts` lines the build still
# succeeds and still produces a package, just one whose server greets the user
# with "the interface has not been built". `tests/test_packaging.py` builds a
# real wheel and a real sdist and looks inside; keep it, or this comment is the
# only thing standing between a release and a blank page.
#
# Build order is always `npm run build` first, then `python -m build`.

[tool.hatch.build.targets.wheel]
packages = ["src/jobsheet"]
artifacts = ["/src/jobsheet/web/**"]

[tool.hatch.build.targets.sdist]
artifacts = ["/src/jobsheet/web/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Live tests are opt-in. A default `pytest` must never reach out to someone
# else's server: it makes the suite slow, flaky and impolite, and it turns a
# third party's outage into a broken build. `pytest -m network` runs them.
addopts = "-m 'not network'"
markers = [
    "network: hits a live third-party endpoint; run nightly, not on every push",
]

[tool.coverage.run]
source = ["src/jobsheet"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "PTH", "S"]
ignore = [
    "S101",  # assert is fine in tests
    "S310",  # urllib scheme check — we build every URL ourselves
]

[tool.ruff.lint.per-file-ignores]
# RUF012: recorded API payloads are read-only fixtures shared by a test class;
# annotating each one as ClassVar adds noise without adding safety.
"tests/*" = ["S", "B011", "RUF012", "E501"]

[tool.mypy]
python_version = "3.11"
packages = ["jobsheet"]
mypy_path = "src"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["openpyxl.*"]
ignore_missing_imports = true
